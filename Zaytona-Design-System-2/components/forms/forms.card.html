<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-app); padding: 22px; }
  #root { display: flex; flex-direction: column; gap: 18px; max-width: 460px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .04em;
         text-transform: uppercase; color: var(--text-muted); width: 100%; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const DS = window.ThalajaDesignSystem_ed2185;
  const { Input, Checkbox, QtyStepper, SegmentedControl } = DS;
  function Demo() {
    const [v, setV] = React.useState('Sukkari dates');
    const [c, setC] = React.useState(true);
    const [q, setQ] = React.useState(2);
    const [seg, setSeg] = React.useState('buy');
    return (
      <>
        <div className="row"><span className="lbl">Input</span>
          <Input value={v} onChange={setV} placeholder="Add item…" style={{maxWidth:300}}/>
        </div>
        <div className="row"><span className="lbl">Checkbox · QtyStepper</span>
          <Checkbox checked={c} onChange={setC} label="Laban, full fat"/>
          <QtyStepper value={q} onChange={setQ} unit="kg"/>
        </div>
        <div className="row"><span className="lbl">SegmentedControl</span>
          <SegmentedControl value={seg} onChange={setSeg}
            options={[{value:'buy',label:'To buy',badge:7},{value:'bought',label:'Bought',badge:5}]}/>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>

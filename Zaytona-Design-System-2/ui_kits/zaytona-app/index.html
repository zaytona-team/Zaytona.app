  html, body { margin: 0; min-height: 100%; }

  /* Splash — sticker peel */
  @keyframes zpeel {
    0%   { opacity: 0; transform: perspective(720px) rotateX(-64deg) translateY(30px) scale(.7); }
    55%  { opacity: 1; }
    72%  { transform: perspective(720px) rotateX(9deg) translateY(-9px) scale(1.06); }
    100% { opacity: 1; transform: perspective(720px) rotateX(0deg) translateY(0) scale(1); }

    0%   { opacity: 0; transform: scale(.55) translateY(30px); }
    72%  { opacity: .5; transform: scale(1.05) translateY(6px); }
    100% { opacity: .34; transform: scale(1) translateY(4px); }
  }
  @keyframes zrise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  /* Splash v2 — Zaytona seal pop + cream reveal */
  @keyframes zseal {
    0%   { opacity: 0; transform: scale(.62) rotate(-14deg); }
    60%  { opacity: 1; transform: scale(1.06) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes zspin-slow { to { transform: rotate(360deg); } }
  @keyframes zdollup { 0% { opacity:0; transform: translateY(64px) rotate(-12deg); } 100% { opacity:1; transform: translateY(0) rotate(-6deg); } }
  @keyframes zreveal { from { transform: scale(0); } to { transform: scale(9); } }
  @keyframes zfadeout { to { opacity: 0; transform: translateY(-10px) scale(.97); } }
  @keyframes zpulse { 0%,100% { transform: scale(1); opacity:.2 } 50% { transform: scale(1.12); opacity:.1 } }
  @keyframes zdot  { 0%, 100% { opacity: .28; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
  @keyframes zfloat { from { transform: translateY(0) rotate(var(--r, 0deg)); } to { transform: translateY(-10px) rotate(var(--r, 0deg)); } }
  /* iOS-style navigation + presentation motion */
  @keyframes znav { from { transform: translateX(var(--nav-dx, 20px)); } to { transform: none; } }
  @keyframes zsheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes zscrim { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zpop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ztab { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes zdrawerIn { from { transform: translateX(var(--dx, -100%)); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; }
  }

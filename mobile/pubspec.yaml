name: zaytona
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+3

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  get_it: ^9.2.1
  equatable: ^2.0.7
  zaytona_design_system:
    path: packages/zaytona_design_system

  # ── Push notifications (FCM) ─────────────────────────────
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # FCM only auto-displays a system notification when the app is backgrounded
  # or terminated — when it's in the foreground, onMessage fires with no UI
  # of its own, so we show one ourselves via this.
  flutter_local_notifications: ^22.2.0
  custom_refresh_indicator: ^4.0.1
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/zaytouna_logo.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  generate: true # gen-l10n: builds AppLocalizations from lib/l10n/*.arb

  assets:
    - assets/images/
    - assets/images/team/
    - assets/fonts/
    - assets/cat-art/

  fonts:
    - family: MADE Tommy Soft
      fonts:
        - asset: assets/fonts/MADETommySoft.otf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
